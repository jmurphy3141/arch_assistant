<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archie — AI Architecture Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-app: #04050a;
    --bg-chat: #050609;
    --bg-sidebar: #0a0c14;
    --bg-panel: #0b0d14;
    --bg-panel-hi: #0f1320;
    --border: #1a2035;
    --border-soft: #141a2c;
    --blue: #8fb4ff;
    --cyan: #61dafb;
    --orange: #e8571a;
    --red: #e8571a;
    --red-weak: rgba(232,87,26,0.1);
    --display: "Syne", sans-serif;
    --services: #a9c2ff;
    --muted: #6b7a94;
    --muted-2: #8b97b0;
    --text: #d8e0f0;
    --text-dim: #aeb9d0;
    --user-bubble: #111a31;
    --user-bubble-border: #233357;
    --radius: 6px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-app);
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { height: 100%; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1a2238; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #26314f; }

  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }

  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.82); }
  }
  @keyframes fade-up {
    from { transform: translateY(7px); }
    to { transform: translateY(0); }
  }
  @keyframes shimmer {
    0% { background-position: -180px 0; }
    100% { background-position: 180px 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#0a0c14"/>
      <circle cx="50" cy="50" r="30" fill="#e8571a"/>
      <circle cx="40" cy="44" r="4" fill="#1a1208"/>
      <circle cx="60" cy="44" r="4" fill="#1a1208"/>
      <path d="M44 60 Q50 56 56 60" stroke="#1a1208" stroke-width="2.5" fill="none"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="parts.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
